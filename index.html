<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Assouline Team — Email Journeys</title>
<meta name="robots" content="noindex">
<style>
  :root{--gold:#ab865b;--ink:#1d1d1d;--taupe:#8a8170;--line:#e6ddd0;--cream:#faf7f2;--bg:#f3f1ed}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
  header{background:#fff;border-bottom:1px solid var(--line);padding:28px 16px 0;text-align:center}
  .brand{font-family:Georgia,'Times New Roman',serif;color:var(--gold);font-size:13px;letter-spacing:5px;text-transform:uppercase}
  .kicker{font-weight:bold;color:var(--gold);font-size:10px;letter-spacing:3px;text-transform:uppercase}
  h1{margin:14px 0 6px;font-size:34px;line-height:38px;letter-spacing:1px;text-transform:uppercase}
  .deck{font-family:Georgia,serif;font-style:italic;color:var(--gold);font-size:18px}
  .tabs{display:flex;justify-content:center;gap:4px;margin-top:22px;flex-wrap:wrap}
  .tabs button{border:0;background:none;padding:12px 18px;font:bold 11px Arial;letter-spacing:3px;text-transform:uppercase;color:var(--taupe);cursor:pointer;border-bottom:3px solid transparent}
  .tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
  .wrap{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:24px;max-width:1240px;margin:24px auto;padding:0 16px}
  .inbox{background:#fff;border:1px solid var(--line);align-self:start;position:sticky;top:16px}
  .inbox h2{margin:0;padding:14px 18px;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--taupe);border-bottom:1px solid var(--line)}
  .msg{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:16px 18px;cursor:pointer;font:inherit;color:inherit}
  .msg:hover{background:var(--cream)}
  .msg[aria-current="true"]{background:var(--cream);box-shadow:inset 3px 0 0 var(--gold)}
  .meta{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--taupe);margin-bottom:5px}
  .from{font-weight:bold;color:var(--ink)}
  .subj{font-weight:bold;font-size:14px;line-height:19px;margin-bottom:3px}
  .prev{font-size:13px;line-height:18px;color:var(--taupe);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .viewer{min-width:0}
  .bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);padding:12px 16px;margin-bottom:16px}
  .toggle{display:inline-flex;border:1px solid var(--ink)}
  .toggle button{border:0;background:#fff;padding:9px 14px;font:bold 10px Arial;letter-spacing:2px;text-transform:uppercase;cursor:pointer;color:var(--ink)}
  .toggle button[aria-pressed="true"]{background:var(--ink);color:#fff}
  label{font-size:11px;letter-spacing:1px;color:var(--taupe);text-transform:uppercase;font-weight:bold}
  input{margin-left:8px;border:1px solid var(--line);padding:8px 10px;font:14px Georgia,serif;width:150px}
  .envelope{background:#fff;border:1px solid var(--line);padding:18px 20px;margin-bottom:16px}
  .envelope .row{display:flex;gap:12px;font-size:13px;line-height:20px;padding:2px 0}
  .envelope .k{width:72px;flex:none;color:var(--taupe);font-size:10px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;padding-top:2px}
  .envelope .v{font-family:Georgia,serif}
  .envelope a{color:var(--gold);font:bold 10px Arial;letter-spacing:2px;text-transform:uppercase;text-decoration:none;border-bottom:2px solid var(--gold)}
  .stage{display:flex;justify-content:center}
  iframe{border:0;background:#fff;width:100%;max-width:100%;height:1200px;box-shadow:0 1px 3px rgba(0,0,0,.08);transition:width .2s}
  .stage.mobile iframe{width:390px;border-radius:24px;border:10px solid #1d1d1d}
  footer{text-align:center;color:var(--taupe);font-size:11px;padding:10px 16px 40px}
  @media (max-width:860px){.wrap{grid-template-columns:1fr}.inbox{position:static}h1{font-size:26px;line-height:30px}}
</style>
</head>

<header>
  <div class="brand">The Assouline Team</div>
  <div style="height:22px"></div>
  <div class="kicker" id="kicker"></div>
  <h1 id="title"></h1>
  <div class="deck" id="deck"></div>
  <div class="tabs" role="tablist" id="tabs"></div>
</header>
<div class="wrap">
  <nav class="inbox" aria-label="Emails">
    <h2>Inbox preview</h2>
    <div id="list"></div>
  </nav>
  <main class="viewer">
    <div class="bar">
      <div class="toggle" role="group" aria-label="Screen size">
        <button type="button" id="desk" aria-pressed="true">Desktop</button>
        <button type="button" id="mob" aria-pressed="false">Mobile</button>
      </div>
      <label>First name <input id="fname" value="Alexandra" autocomplete="off"></label>
    </div>
    <div class="envelope">
      <div class="row"><div class="k">From</div><div class="v">The Assouline Team</div></div>
      <div class="row"><div class="k">Subject</div><div class="v" id="esubj"></div></div>
      <div class="row"><div class="k">Preview</div><div class="v" id="eprev" style="font-style:italic;color:#3c3c3c"></div></div>
      <div class="row"><div class="k">Code</div><div class="v"><a id="ecode" href="#" target="_blank">Open the HTML file</a></div></div>
    </div>
    <div class="stage" id="stage"><iframe id="frame" title="Email preview"></iframe></div>
  </main>
</div>

e-height: 1px;font-size: 0;background: #3FC1CB;-ms-text-size-adjust: 100%;-webkit-text-size-adjust: 100%;mso-table-lspace: 0pt;mso-table-rspace: 0pt;border-collapse: collapse;border-spacing: 0;\">&nbsp;<\/td><\/tr><\/table><\/td><\/tr><tr style=\"-ms-text-size-adjust: 100%;-webkit-text-size-adjust: 100%;\"><td class=\"px\" style=\"background: #0B2F33;padding: 28px 56px 8px;-ms-text-size-adjust: 100%;-webkit-text-size-adjust: 100%;mso-table-lspace: 0pt;mso-table-rspace: 0pt;border-collapse: collapse;border-spacing: 0;\"><p class=\"serif\" style=\"margin: 0 0 20px;font-family: 'Bodoni Moda',Didot,Georgia,'Times New Roman',serif;color: #FAF9F4;font-size: 18px;line-height: 29px;-ms-text-size-adjust: 100%;-webkit-text-size-adjust: 100%;\">*|IF:FNAME|*Dear *|FNAME|*,*|ELSE:|*Hello,*|END:IF|*<\/p><p class=\"serif\" style=\"margin: 0 0 20px;font-family: 'Bodoni Moda',Didot,Georgia,'Times New Roman',serif;color: #A9C4C6;font-size: 16px;line-height: 28px;-ms-text-size-adjust: 100%;-webkit-text-size-adjust: 100%;\">Following our introduction to 7845 and 7833 Atlantic Way, we wanted to take you beyond the numbers and onto the grounds.<\/p><p class=\"serif\" style=\"margin: 0;font-family: 'Bodoni Moda',Didot,Georgia,'Times New Roman',serif;color: #A9C4C6;font-size: 16px;line-height: 28px;-ms-text-size-adjust: 100%;-webkit-text-size-adjust: 100%;\">Side by side in Altos del Mar, these two estates come together as a private resort: 33,000 square feet of beachfront land and more than 13,000 square feet of interior living, framed by mature palms with the ocean just beyond the dunes.<\/p><\/td><\/tr><tr style=\"-ms-text-size-adjust: 100%;-webkit-text-size-adjust: 100%;\"><td style=\"background: #0B2F33;height: 40px;line-height: 40px;font-size: 0;-ms-text-size-adjust: 100%;-webkit-text-size-adjust: 100%;mso-table-lspace: 0pt;mso-table-rspace: 0pt;border-collapse: collapse;border-spacing: 0;\">&nbsp;<\/td><\/tr><tr style=\"-ms-text-size-adjust: 100%;-webkit-text-size-adjust: 100%;\"><td style=\"background: #0B2F33;font-size: 0;line-height: 0;-ms-text-size-adjust: 100%;-webkit-text-size-adjust: 100%;mso-table-lspace: 0pt;mso-table-rspace: 0pt;border-collapse: collapse;border-spacing: 0;\"><img src=\"https://assoulineteam.com/wp-content/uploads/DJI_20260129105337_0028_D-HIGH-1024x687.webp\" width=\"600\" alt=\"The compound seen from the dunes, with the estates beyond the gardens\" style=\"width: 100%;max-width: 600px;height: auto;display: block;-ms-text-size-adjust: 100%;-webkit-text-size-adjust: 100%;-ms-interpolation-mode: bicubic;border: 0;line-height: 100%;outline: none;text-decoration: none;\"><\/td><\/tr><tr style=\"-ms-text-size-adjust: 100%;-webkit-text-size-adjust: 100%;\"><td class=\"px\" style=\"background: #0B2F33;padding: 22px 56px 40px;-ms-text-size-adjust: 100%;-webkit-text-size-adjust: 100%;mso-table-lspace: 0pt;mso-table-rspace: 0pt;border-collapse: collapse;border-spacing: 0;\"><div class=\"serif\" style=\"font-family: 'Bodoni Moda',Didot,Georgia,'Times New Roman',serif;color: #FAF9F4;font-size: 24px;line-height: 30px;-ms-text-size-adjust: 100%;-webkit-text-size-adjust: 100%;\">Oceanfront by Design<\/div><div class=\"sans\" style=\"font-family: 'Hanken Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif;color: #A9C4C6;font-size: 15px;line-height: 25px;padding-top: 10px;-ms-text-size-adjust: 100%;-webkit-text-size-adjust: 100%;\">Follow the garden path through the dunes and you&rsquo;re on the sand. Sunrise swims, long walks along the shore, and the Atlantic in view from the rooftop terraces above.<\/div><\/td><\/tr><tr style=\"-ms-text-size-adjust: 100%;-webkit-text-size-adjust: 100%;\"><td style=\"background: #0B2F33;font-size: 0;line-height: 0;-ms-text-size-adjust: 100%;-webkit-text-size-adjust: 100%;mso-table-lspace: 0pt;mso-table-rspace: 0pt;border-collapse: collapse;border-spacing: 0;\"><img src=\"https://assoulineteam.com/wp-content/uploads/DJI_20260129104718_0990_D-HIGH-1024x765.webp\" width=\"600\" alt=\"The compound from s-text-size-adjust: 100%;-webkit-text-size-adjust: 100%;\"><td class=\"px\" style=\"background: #0B2F33;padding: 22px 56px 40px;-ms-text-size-adjust: 100%;-webkit-text-size-adjust: 100%;mso-table-lspace: 0pt;mso-table-rspace: 0pt;border-collapse: collapse;border-spacing: 0;\"><div class=\"serif\" style=\"font-family: 'Bodoni Moda',Didot,Georgia,'Times New Roman',serif;color: #FAF9F4;font-size: 24px;line-height: 30px;-ms-text-size-adjust: 100%;-webkit-text-size-adjust: 100%;\">Two Estates. Your World.<\/div><div class=\"sans\" style=\"font-family: 'Hanken Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif;color: #A9C4C6;font-size: 15px;line-height: 25px;padding-top: 10px;-ms-text-size-adjust: 100%;-webkit-text-size-adjust: 100%;\">Live in one and host in the other, unite them as a singular estate experience, or reimagine the compound entirely as your own. However you shape them, the compound is yours to define.<\/div><\/td><\/tr><tr style=\"-ms-text-size-adjust: 100%;-webkit-text-size-adjust: 100%;\"><td class=\"px\" style=\"background: #FAF9F4;padding: 52px 56px 48px;-ms-text-size-adjust: 100%;-webkit-text-size-adjust: 100%;mso-table-lspace: 0pt;mso-table-rspace: 0pt;border-collapse: collapse;border-spacing: 0;\"><div class=\"sans\" style=\"font-family: 'Hanken Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif;color: #145A60;font-size: 11px;letter-spacing: 3px;text-transform: uppercase;-ms-text-size-adjust: 100%;-webkit-text-size-adjust: 100%;\">The location<\/div><div style=\"height: 14px;line-height: 14px;font-size: 0;-ms-text-size-adjust: 100%;-webkit-text-size-adjust: 100%;\">&nbsp;<\/div><div class=\"h2 serif\" style=\"font-family: 'Bodoni Moda',Didot,Georgia,'Times New Roman',serif;color: #0B2F33;font-size: 28px;line-height: 35px;-ms-text-size-adjust: 100%;-webkit-text-size-adjust: 100%;\">Moments from everything.<br style=\"-ms-text-size-adjust: 100%;-webkit-text-size-adjust: 100%;\">Worlds away from it all.<\/div><div style=\"height: 18px;line-height: 1 <script>
  const journeys = JSON.parse(document.getElementById('journeys').textContent);
  const $ = id => document.getElementById(id);
  const list = $('list'), frame = $('frame'), fname = $('fname'), stage = $('stage');
  let j = 0, current = 0;
  const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const name = () => fname.value.trim();
  function personalize(s){
    s = s.replace(/\*\|IF:FNAME\|\*([\s\S]*?)\*\|ELSE:\|\*([\s\S]*?)\*\|END:IF\|\*/g, (m,a,b) => name() ? a : b);
    s = s.replace(/\*\|IF:FNAME\|\*([\s\S]*?)\*\|END:IF\|\*/g, (m,a) => name() ? a : '');
    return s.replace(/\*\|FNAME\|\*/g, esc(name() || 'there')).replace(/\*\|[A-Z_:]+\|\*/g, '');
  }
  function renderTabs(){
    $('tabs').style.display = journeys.length > 1 ? '' : 'none';
    $('tabs').innerHTML = journeys.map((x,i) => `<button role="tab" type="button" data-j="${i}" aria-selected="${i===j}">${esc(x.name)}</button>`).join('');
    const J = journeys[j];
    $('kicker').textContent = `Email journey · ${J.emails.length} emails`;
    $('title').textContent = J.name; $('deck').textContent = J.deck;
  }
  function renderList(){
    list.innerHTML = journeys[j].emails.map((e,i) => `<button class="msg" type="button" data-i="${i}" aria-current="${i===current}">
      <div class="meta"><span class="from">The Assouline Team</span><span>Email ${e.n} · ${esc(e.label)}</span></div>
      <div class="subj">${esc(personalize(e.subject))}</div><div class="prev">${esc(personalize(e.preview))}</div></button>`).join('');
  }
  function fit(){ try{ frame.style.height = (frame.contentDocument.documentElement.scrollHeight + 4) + 'px'; }catch(e){} }
  function show(i){
    current = i; const e = journeys[j].emails[i];
    $('esubj').textContent = personalize(e.subject);
    $('eprev').textContent = personalize(e.preview);
    $('ecode').href = e.file || '#'; $('ecode').closest('.row').style.display = e.file ? '' : 'none';
    frame.srcdoc = personalize(e.html);
    renderList();
    try { history.replaceState(null, '', `#${journeys[j].slug}-${e.n}`); } catch(err) {}
  }
  function pick(ji, i){ j = ji; renderTabs(); show(i || 0); }
  frame.addEventListener('load', () => { fit(); const d = frame.contentDocument;
    d.querySelectorAll('img').forEach(im => im.addEventListener('load', fit));
    d.querySelectorAll('a[href]').forEach(a => { if (a.getAttribute('href') !== '#') a.target = '_blank'; }); });
  list.addEventListener('click', ev => { const b = ev.target.closest('.msg'); if (!b) return; show(+b.dataset.i);
    if (window.matchMedia('(max-width:860px)').matches) document.querySelector('.viewer').scrollIntoView({behavior:'smooth'}); });
  $('tabs').addEventListener('click', ev => { const b = ev.target.closest('[data-j]'); if (b) pick(+b.dataset.j, 0); });
  fname.addEventListener('input', () => show(current));
  const desk = $('desk'), mob = $('mob');
  function size(mobile){ stage.classList.toggle('mobile', mobile); desk.setAttribute('aria-pressed', !mobile); mob.setAttribute('aria-pressed', mobile); setTimeout(fit, 250); }
  desk.onclick = () => size(false); mob.onclick = () => size(true);
  window.addEventListener('resize', fit);
  function fromHash(){
    const m = location.hash.match(/^#(.+)-(\d)$/);
    const ji = m ? Math.max(0, journeys.findIndex(x => x.slug === m[1])) : 0;
    pick(ji, m ? Math.max(0, Math.min(journeys[ji].emails.length - 1, m[2] - 1)) : 0);
  }
  window.addEventListener('hashchange', fromHash);
  fromHash();
</script>
